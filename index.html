<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plataforma X - Acesso</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="home-box">
    <h1>🔐 Plataforma X — Acesso</h1>
    <p class="note">Faça login com sua conta. Se for administrador, será redirecionado ao painel admin.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">👤 Email ou Usuário</label>
        <input type="text" id="login" name="login" required placeholder="email@exemplo.com ou usuário admin">
      </div>
      <div class="form-group">
        <label for="password">🔑 Senha</label>
        <input type="password" id="password" name="password" required placeholder="Digite sua senha">
      </div>
      <div class="home-actions">
        <button type="submit" class="btn btn-admin">🚀 Entrar</button>
        <a class="btn btn-register" href="registro.html">📝 Registrar-se</a>
      </div>
      <div id="loginMsg" class="alert alert-error" style="margin-top:10px;"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      msg.textContent = '';
      try{
        const res = await fetch('api/auth.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({login, password})
        });
        const data = await res.json();
        if (res.ok && data.sucesso) {
          window.location.href = data.redirect;
        } else {
          msg.textContent = data.erro || 'Credenciais inválidas';
        }
      } catch(err) {
        msg.textContent = 'Erro na comunicação: ' + err.message;
      }
    });
  </script>
</body>
</html>
